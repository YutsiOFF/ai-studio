name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Compiler l'application
        run: npm run build

      # Pull request : installateur construit pour vérification, rien n'est publié.
      - name: Créer l'installateur (.exe)
        if: ${{ github.event_name == 'pull_request' }}
        run: npx electron-builder --win --publish never

      # main : publie (ou complète) la version vX.Y.Z définie dans package.json.
      # Les utilisateurs reçoivent la mise à jour automatiquement.
      - name: Publier la version sur GitHub Releases
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Joindre l'installateur au build
        uses: actions/upload-artifact@v4
        with:
          name: AI-Studio-Setup
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
